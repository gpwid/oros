<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oros Studio - Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    body {
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-card {
      width: 420px;
      height: 240px;
      background: #0d0f12;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    .ambient-glow {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, rgba(13, 15, 18, 0) 70%);
      pointer-events: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .version-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      background: #181b22;
      border: 1px solid #282e3c;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .skip-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .skip-btn:hover {
      background: #1e232d;
      color: #f1f5f9;
      border-color: rgba(212, 175, 55, 0.4);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: -6px;
      z-index: 2;
    }

    .logo-container {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #d4af37;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.35)); }
      50% { filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.75)); }
    }

    .app-title {
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f8fafc;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
      min-height: 18px;
      transition: color 0.3s ease;
    }

    .status-text.highlight {
      color: #38bdf8;
    }

    .status-text.success {
      color: #34d399;
    }

    .status-text.offline {
      color: #fbbf24;
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: #181b22;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-top: 14px;
      z-index: 2;
    }

    .progress-bar-determinate {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f59e0b);
      width: 0%;
      transition: width 0.2s ease;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .progress-bar-indeterminate {
      height: 100%;
      background: linear-gradient(90deg, transparent, #d4af37, #f59e0b, transparent);
      position: absolute;
      width: 50%;
      animation: indeterminate-slide 1.5s infinite linear;
    }

    @keyframes indeterminate-slide {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    .footer-detail {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 10px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="ambient-glow"></div>

    <div class="header-bar">
      <span class="version-tag" id="currentVersionTag">v0.1.0</span>
      <button class="skip-btn" id="skipBtn" title="Bypass update check and open Oros Studio">Launch App</button>
    </div>

    <div class="main-content">
      <div class="logo-container">
        <!-- Mountain Glyph Logo -->
        <svg class="logo-svg" viewBox="0 0 24 24">
          <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
          <path d="M4.14 15h15.72" stroke-dasharray="2 2" stroke-width="1.2" />
        </svg>
      </div>
      <div class="app-title">Oros Studio</div>
      <div class="status-text" id="statusText">Checking for updates...</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-indeterminate" id="progressIndeterminate"></div>
      <div class="progress-bar-determinate" id="progressDeterminate" style="display: none;"></div>
    </div>

    <div class="footer-detail">
      <span id="targetRepo">github.com/gpwid/oros</span>
      <span id="detailSubtext">Starting...</span>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const versionTag = document.getElementById('currentVersionTag');
    const skipBtn = document.getElementById('skipBtn');
    const progressIndeterminate = document.getElementById('progressIndeterminate');
    const progressDeterminate = document.getElementById('progressDeterminate');
    const detailSubtext = document.getElementById('detailSubtext');

    if (window.orosSplash) {
      skipBtn.addEventListener('click', () => {
        statusText.textContent = 'Launching application...';
        window.orosSplash.skipUpdate();
      });

      window.orosSplash.onStatus((status) => {
        if (!status) return;

        if (status.currentVersion) {
          versionTag.textContent = 'v' + status.currentVersion.replace(/^v/i, '');
        }

        if (status.state === 'checking') {
          statusText.className = 'status-text';
          statusText.textContent = status.text || 'Checking for updates...';
          detailSubtext.textContent = 'Contacting GitHub Releases';
          progressIndeterminate.style.display = 'block';
          progressDeterminate.style.display = 'none';
        } else if (status.state === 'offline') {
          statusText.className = 'status-text offline';
          statusText.textContent = status.text || 'No internet connection — launching offline mode';
          detailSubtext.textContent = 'Offline';
          progressIndeterminate.style.display = 'none';
          progressDeterminate.style.display = 'block';
          progressDeterminate.style.width = '100%';
        } else if (status.state === 'up-to-date') {
          statusText.className = 'status-text success';
          statusText.textContent = status.text || "You're running the latest version!";
          detailSubtext.textContent = 'Ready';
          progressIndeterminate.style.display = 'none';
          progressDeterminate.style.display = 'block';
          progressDeterminate.style.width = '100%';
        } else if (status.state === 'downloading') {
          statusText.className = 'status-text highlight';
          const pct = Math.round(status.percent || 0);
          statusText.textContent = status.text || `Downloading update... (${pct}%)`;
          detailSubtext.textContent = `${(status.transferredMb || 0).toFixed(1)} MB / ${(status.totalMb || 0).toFixed(1)} MB`;
          progressIndeterminate.style.display = 'none';
          progressDeterminate.style.display = 'block';
          progressDeterminate.style.width = pct + '%';
        } else if (status.state === 'ready-to-install') {
          statusText.className = 'status-text success';
          statusText.textContent = status.text || 'Update ready! Installing...';
          detailSubtext.textContent = 'Restarting';
          progressDeterminate.style.width = '100%';
        } else if (status.state === 'launching') {
          statusText.className = 'status-text';
          statusText.textContent = status.text || 'Launching Oros Studio...';
          detailSubtext.textContent = 'Loading Vault';
        }
      });
    } else {
      // Fallback for preview in browser
      setTimeout(() => {
        statusText.textContent = 'Offline preview mode';
      }, 1000);
    }
  </script>
</body>
</html>
