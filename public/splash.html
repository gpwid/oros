<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oros Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Architectural Tactile Frame matching DESIGN.md */
    .app-frame {
      width: 440px;
      height: 240px;
      background: #090a0d;
      border: 1px solid #212732;
      border-radius: 4px;
      box-shadow: 
        0 24px 48px -12px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding: 14px 18px 14px 18px;
    }

    /* Subtle Architectural Grid Background Watermark */
    .app-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Top Drag Header */
    .header-bar {
      -webkit-app-region: drag;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      height: 24px;
      padding-bottom: 8px;
      border-b: 1px solid rgba(33, 39, 50, 0.6);
    }

    .brand-id {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #8793a7;
      text-transform: uppercase;
    }

    .brand-id svg {
      width: 11px;
      height: 14px;
      color: #d4af37;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      color: #8793a7;
      background: #14171f;
      border: 1px solid #212732;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    .skip-btn {
      -webkit-app-region: no-drag;
      background: #14171f;
      border: 1px solid #212732;
      color: #b4bdcd;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .skip-btn:hover {
      background: #1b1f28;
      color: #edf0f4;
      border-color: #333d4f;
    }

    .skip-btn:active {
      transform: scale(0.97);
    }

    /* Central Sigil & Wordmark */
    .center-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      padding-top: 4px;
    }

    .emblem-wrapper {
      width: 38px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .emblem-svg {
      width: 36px;
      height: 46px;
      fill: none;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.25));
    }

    .title-wordmark {
      font-family: "Playfair Display", "Cinzel", Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #edf0f4;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 18px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
      transition: all 0.2s ease;
    }

    .status-dot.ready {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .status-dot.offline {
      background: #d97706;
      box-shadow: 0 0 6px rgba(217, 119, 6, 0.4);
    }

    .status-dot.downloading {
      background: #06b6d4;
      box-shadow: 0 0 6px rgba(6, 182, 212, 0.6);
    }

    .status-label {
      font-size: 11px;
      font-weight: 500;
      color: #b4bdcd;
      letter-spacing: 0.02em;
    }

    /* Tactile Recessed Progress Trench */
    .progress-track {
      width: 100%;
      height: 3px;
      background: #14171f;
      border: 1px solid #212732;
      border-radius: 1px;
      overflow: hidden;
      position: relative;
      margin-top: 12px;
      z-index: 2;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #b88e28, #d4af37);
      width: 0%;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-sweep {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      position: absolute;
      animation: sweep-line 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes sweep-line {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    /* Metadata Footer */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(33, 39, 50, 0.4);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      color: #606b81;
      z-index: 2;
    }
  </style>
</head>

        <span>Oros Codex</span>
      </div>
      <div class="controls-group">
        <span class="version-chip" id="currentVersionTag">v0.1.0</span>

    <!-- Progress Trench -->
    <div class="progress-track">
      <div class="progress-sweep" id="progressSweep"></div>
      <div class="progress-fill" id="progressFill" style="display: none;"></div>
    </div>

    <!-- Micro Footer -->
    <div class="footer-bar">
      <span>github.com/gpwid/oros</span>
      <span id="detailSubtext">Archival Sync</span>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const versionTag = document.getElementById('currentVersionTag');
    const skipBtn = document.getElementById('skipBtn');
    const progressSweep = document.getElementById('progressSweep');
    const progressFill = document.getElementById('progressFill');
    const detailSubtext = document.getElementById('detailSubtext');

    if (window.orosSplash) {
      skipBtn.addEventListener('click', () => {
        statusText.textContent = 'Launching studio...';
        window.orosSplash.skipUpdate();
      });

      window.orosSplash.onStatus((status) => {
        if (!status) return;

        if (status.currentVersion) {
          versionTag.textContent = 'v' + status.currentVersion.replace(/^v/i, '');
        }

        if (status.state === 'checking') {
          statusDot.className = 'status-dot';
          statusText.textContent = status.text || 'Checking for updates...';
          detailSubtext.textContent = 'GitHub Releases';
          progressSweep.style.display = 'block';
          progressFill.style.display = 'none';
        } else if (status.state === 'offline') {
          statusDot.className = 'status-dot offline';
          statusText.textContent = status.text || 'Offline mode — opening studio';
          detailSubtext.textContent = 'Offline Mode';
          progressSweep.style.display = 'none';
          progressFill.style.display = 'block';
          progressFill.style.width = '100%';
        } else if (status.state === 'up-to-date') {
          statusDot.className = 'status-dot ready';
          statusText.textContent = status.text || 'Up to date (v' + (status.currentVersion || '0.1.0') + ')';
          detailSubtext.textContent = 'Synchronized';
          progressSweep.style.display = 'none';
          progressFill.style.display = 'block';
          progressFill.style.width = '100%';
        } else if (status.state === 'downloading') {
          statusDot.className = 'status-dot downloading';
          const pct = Math.round(status.percent || 0);
          statusText.textContent = status.text || `Downloading update... (${pct}%)`;
          detailSubtext.textContent = `${(status.transferredMb || 0).toFixed(1)} MB / ${(status.totalMb || 0).toFixed(1)} MB`;
          progressSweep.style.display = 'none';
          progressFill.style.display = 'block';
          progressFill.style.width = pct + '%';
        } else if (status.state === 'ready-to-install') {
          statusDot.className = 'status-dot ready';
          statusText.textContent = status.text || 'Update ready — installing...';
          detailSubtext.textContent = 'Restarting';
          progressFill.style.width = '100%';
        } else if (status.state === 'launching') {
          statusDot.className = 'status-dot ready';
          statusText.textContent = status.text || 'Launching studio...';
          detailSubtext.textContent = 'Opening Workspace';
        }
      });
    }
  </script>

</html>
